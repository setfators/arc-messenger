[package]
name = "rust-messenger"
version = "0.1.0"
edition = "2021"
description = "Маленький мессенджер на Rust: сервер на axum + чат в браузере"

[[bin]]
name = "rust-messenger"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
sha2 = "0.10"

[profile.release]
strip = true
