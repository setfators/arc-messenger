<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мессенджер</title>
<style>
  :root {
    --bg: #1b1c20; --panel: #23252b; --panel2: #2b2d34; --line: #35383f;
    --text: #e8eaed; --muted: #9aa0ab; --accent: #5865f2; --ok: #3ba55d; --danger: #ed4245;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; }
  .hidden { display: none !important; }

  /* ---------- авторизация ---------- */
  .auth {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 30% 0%, #2a2350 0%, #16171b 60%);
    padding: 20px; z-index: 20;
  }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .auth-card h1 { margin: 0 0 6px; font-size: 22px; }
  .auth-card .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--muted);
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .auth-card input {
    width: 100%; padding: 11px 13px; margin-bottom: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text); outline: none;
  }
  .auth-card input:focus { border-color: var(--accent); }
  .primary {
    background: var(--accent); border: none; color: #fff; border-radius: 10px;
    padding: 11px 16px; font-weight: 600;
  }
  .primary:disabled { opacity: .6; cursor: default; }
  .auth-card .primary { width: 100%; }
  .err { color: #ff8a8d; font-size: 13px; min-height: 18px; margin-top: 8px; }
  .link { background: none; border: none; color: var(--muted); font-size: 13px; padding: 6px 0 0; }

  /* ---------- каркас ---------- */
  .app { display: grid; grid-template-columns: 74px 250px 1fr; height: 100%; }
  .rail {
    background: #141519; display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 12px 0; border-right: 1px solid var(--line);
  }
  .me {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; color: #fff; background: var(--accent); margin-bottom: 6px;
  }
  .rail-btn {
    width: 46px; height: 46px; border-radius: 14px; border: none; background: var(--panel2);
    font-size: 18px; display: grid; place-items: center;
  }
  .rail-btn.active { background: var(--accent); color: #fff; }
  .rail-spacer { flex: 1; }
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .side-head {
    padding: 16px 16px 10px; font-weight: 700; letter-spacing: .02em;
    border-bottom: 1px solid var(--line);
  }
  .side-scroll { overflow-y: auto; padding: 10px 8px; flex: 1; }
  .side-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    padding: 10px 8px 6px;
  }
  .chan {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    padding: 7px 9px; border-radius: 8px; border: none; background: transparent;
    color: var(--muted); font-size: 14px;
  }
  .chan:hover { background: var(--panel2); color: var(--text); }
  .chan.active { background: #383b45; color: #fff; }
  .chan .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chan .mic { font-size: 13px; opacity: .9; }
  .side-add {
    margin: 6px 8px 10px; padding: 8px; border-radius: 8px; border: 1px dashed var(--line);
    background: transparent; color: var(--muted); font-size: 13px;
  }
  .voice-box {
    border-top: 1px solid var(--line); padding: 10px 12px 12px; background: #1d1f24;
  }
  .voice-head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ok); margin-bottom: 6px; }
  .vuser { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); padding: 3px 0; }
  .vdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .voice-actions { display: flex; gap: 6px; margin-top: 8px; }
  .pill {
    border: 1px solid var(--line); background: var(--panel2); border-radius: 999px;
    padding: 7px 11px; font-size: 12px; color: var(--text);
  }
  .pill.on { border-color: var(--danger); color: #ff9a9c; }
  .pill.danger { border-color: var(--danger); color: #ff9a9c; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 18px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .topbar .tt { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .pill { margin-left: auto; }
  .messages { flex: 1; overflow-y: auto; padding: 18px 18px 8px; }
  .typing {
    height: 18px; padding: 0 20px; font-size: 12px; color: var(--muted);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .msg { display: flex; gap: 10px; padding: 5px 0; }
  .ava {
    width: 36px; height: 36px; border-radius: 50%; flex: 0 0 36px; display: grid;
    place-items: center; font-weight: 700; font-size: 14px; color: #fff;
  }
  .msg .head { display: flex; align-items: baseline; gap: 8px; }
  .msg .who { font-weight: 600; }
  .msg .when { font-size: 11px; color: var(--muted); }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }

  .friends { flex: 1; overflow-y: auto; padding: 18px; }
  .friends-head { display: flex; gap: 8px; margin-bottom: 14px; }
  .friends-head input {
    flex: 1; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); outline: none;
  }
  .frow {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    background: var(--panel);
  }
  .frow + .frow { margin-top: 6px; }
  .frow .nm { flex: 1; }
  .frow .st { font-size: 12px; color: var(--muted); }
  .frow .st.on { color: var(--ok); }
  .frow button { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 6px 10px; font-size: 12px; }

  .composer {
    display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .composer input {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); outline: none;
  }
  .composer input:focus { border-color: var(--accent); }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #000; border: 1px solid var(--line); color: #fff; padding: 10px 16px;
    border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 40; max-width: 80vw;
  }
  .toast.show { opacity: .95; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 60px 1fr; }
    .side { position: fixed; left: 60px; top: 0; bottom: 0; width: 240px; z-index: 10; transform: translateX(-120%); transition: transform .2s; }
    .side.open { transform: none; }
  }
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card">
    <h1>Мессенджер</h1>
    <p class="hint">Аккаунт хранится на сервере: заходите с любого устройства под своим именем.</p>
    <div class="tabs">
      <button class="tab active" id="tabLogin">Вход</button>
      <button class="tab" id="tabReg">Регистрация</button>
    </div>
    <input id="authName" placeholder="Имя (2–20 символов)" maxlength="20" autocomplete="username">
    <input id="authPass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="primary" id="authGo">Войти</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div class="app hidden" id="app">
  <nav class="rail">
    <div class="me" id="meAva">?</div>
    <button class="rail-btn active" id="navChannels" title="Каналы">#</button>
    <button class="rail-btn" id="navFriends" title="Друзья">👥</button>
    <button class="rail-btn" id="navInvite" title="Пригласить друга">🔗</button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="navOut" title="Выйти из аккаунта">⏻</button>
  </nav>

  <aside class="side" id="side">
    <div class="side-head" id="sideTitle">Каналы</div>
    <div class="side-scroll">
      <div class="side-label">Текстовые каналы</div>
      <div id="channels"></div>
      <button class="side-add" id="newChannel">+ создать канал</button>
      <div class="side-label">Личные сообщения</div>
      <div id="dmList"></div>
    </div>
    <div class="voice-box hidden" id="voiceBox">
      <div class="voice-head" id="voiceHead">Голосовой канал</div>
      <div id="voiceUsers"></div>
      <div class="voice-actions">
        <button class="pill on" id="micBtn">🎤 Микрофон</button>
        <button class="pill danger" id="leaveVoice">Выйти</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="tt" id="topTitle"># obshiy</div>
      <div class="pill" id="connState">подключение…</div>
    </header>
    <div class="messages" id="messages"></div>
    <div class="friends hidden" id="friendsPane">
      <div class="friends-head">
        <input id="friendName" placeholder="Имя друга, например Дима" maxlength="20">
        <button class="primary" id="friendAdd">Добавить</button>
      </div>
      <div id="requests"></div>
      <div id="friendList"></div>
    </div>
    <div class="typing" id="typing"></div>
    <form class="composer" id="composer">
      <input id="text" placeholder="Сообщение…" autocomplete="off" maxlength="4000">
      <button class="primary" id="send" type="submit">→</button>
    </form>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  token: localStorage.getItem('token') || '',
  me: null,
  channels: [],
  room: 'obshiy',
  roomKind: 'channel',
  roomTitle: '# obshiy',
  messages: {},
  friends: { friends: [], incoming: [], outgoing: [] },
  online: [],
  dms: [],
  ws: null,
  voiceRoom: null,
  voiceUsers: [],
  muted: false,
  localStream: null,
  peers: new Map(),
  reconnect: null,
  attempts: 0,
  heartbeat: null,
  lastMessageAt: 0,
  typers: new Map(),
  typingSentAt: 0,
  typingTimer: null,
};
const TYPING_THROTTLE_MS = 2500;
const TYPING_HIDE_MS = 4000;
const HEARTBEAT_MS = 25000;
const DEAD_CONNECTION_MS = 65000;
const MAX_RECONNECT_ATTEMPTS = 6;
let authMode = 'login';

/* ------------------------------------------------------------------ утилиты */
function toast(text) {
  const box = $('toast');
  box.textContent = text;
  box.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => box.classList.remove('show'), 2600);
}
function colorOf(name) {
  let h = 0;
  for (const ch of name || '?') h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 48%)`;
}
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  const first = (parts[0] || '?')[0] || '?';
  const second = parts[1] ? parts[1][0] || '' : '';
  return (first + second).toUpperCase();
}
function timeOf(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
function send(obj) {
  if (store.ws && store.ws.readyState === 1) store.ws.send(JSON.stringify(obj));
  else toast('Нет соединения с сервером');
}
function avatar(name) {
  const el = document.createElement('div');
  el.className = 'ava';
  el.style.background = colorOf(name);
  el.textContent = initials(name);
  return el;
}

/* ------------------------------------------------------------------ вход */
function setAuthMode(mode) {
  authMode = mode;
  $('tabLogin').classList.toggle('active', mode === 'login');
  $('tabReg').classList.toggle('active', mode === 'register');
  $('authGo').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
  $('authPass').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('authErr').textContent = '';
}
$('tabLogin').onclick = () => setAuthMode('login');
$('tabReg').onclick = () => setAuthMode('register');
$('authPass').onkeydown = (e) => { if (e.key === 'Enter') goAuth(); };
$('authName').onkeydown = (e) => { if (e.key === 'Enter') $('authPass').focus(); };

async function goAuth() {
  const name = $('authName').value.trim();
  const password = $('authPass').value;
  if (!name || !password) { $('authErr').textContent = 'Введите имя и пароль'; return; }
  $('authGo').disabled = true;
  try {
    const res = await fetch('/api/' + (authMode === 'login' ? 'login' : 'register'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password }),
    });
    const data = await res.json();
    if (!res.ok) { $('authErr').textContent = data.error || 'Не получилось'; return; }
    store.token = data.token;
    localStorage.setItem('token', data.token);
    start();
  } catch (e) {
    $('authErr').textContent = 'Сервер не отвечает: ' + e.message;
  } finally {
    $('authGo').disabled = false;
  }
}
$('authGo').onclick = goAuth;
$('navOut').onclick = () => {
  if (!confirm('Выйти из аккаунта?')) return;
  localStorage.removeItem('token');
  location.reload();
};

/* ------------------------------------------------------------------ соединение */
function start() {
  store.attempts = 0;
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  connect();
}

function stopHeartbeat() {
  clearInterval(store.heartbeat);
  store.heartbeat = null;
}

/* Пингуем сервер и следим, что он вообще отвечает: полумёртвый сокет
   иначе выглядит как «на связи», а сообщения не доходят. */
function startHeartbeat() {
  stopHeartbeat();
  store.lastMessageAt = Date.now();
  store.heartbeat = setInterval(() => {
    const ws = store.ws;
    if (!ws || ws.readyState !== 1) return;
    if (Date.now() - store.lastMessageAt > DEAD_CONNECTION_MS) {
      try { ws.close(); } catch { /* уже закрыт */ }
      return;
    }
    send({ t: 'ping' });
  }, HEARTBEAT_MS);
}

function showAuthExpired(text) {
  clearTimeout(store.reconnect);
  store.reconnect = null;
  stopHeartbeat();
  if (store.ws) {
    const ws = store.ws;
    store.ws = null;
    try { ws.close(); } catch { /* уже закрыт */ }
  }
  localStorage.removeItem('token');
  store.token = '';
  store.me = null;
  store.attempts = 0;
  store.messages = {};
  store.dms = [];
  store.friends = { friends: [], incoming: [], outgoing: [] };
  store.online = [];
  store.typers.clear();
  renderTyping();
  $('app').classList.add('hidden');
  $('auth').classList.remove('hidden');
  $('authErr').textContent = text || 'Сессия истекла — войдите снова';
}

/* Сервер жив, а сокет не пускает — значит протух токен (а не пропала сеть).
   Без такой проверки перезапуск сервера выкидывал бы всех из аккаунта. */
async function probeSession() {
  $('connState').textContent = 'проверяем сессию…';
  $('connState').style.color = 'var(--muted)';
  let alive = false;
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3000);
    const res = await fetch('/health', { signal: controller.signal, cache: 'no-store' });
    clearTimeout(timer);
    alive = res.ok;
  } catch {
    alive = false;
  }
  if (alive) {
    showAuthExpired('Сессия истекла — войдите снова');
    return;
  }
  $('connState').textContent = 'нет связи, переподключаемся…';
  $('connState').style.color = 'var(--danger)';
  clearTimeout(store.reconnect);
  store.reconnect = setTimeout(connect, 5000);
}

function connect() {
  clearTimeout(store.reconnect);
  store.reconnect = null;
  if (store.ws) {
    const old = store.ws;
    store.ws = null;
    try { old.close(); } catch { /* уже закрыт */ }
  }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(store.token)}`);
  let helloed = false;
  store.ws = ws;
  $('connState').textContent = 'подключение…';
  $('connState').style.color = 'var(--muted)';

  ws.onopen = () => {
    $('connState').textContent = 'на связи';
    $('connState').style.color = 'var(--ok)';
    startHeartbeat();
  };
  ws.onmessage = (event) => {
    store.lastMessageAt = Date.now();
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    if (data.t === 'hello') helloed = true;
    handle(data);
  };
  ws.onclose = () => {
    if (store.ws !== ws) return; // старое, уже заменённое соединение
    store.ws = null;
    stopHeartbeat();
    if (!store.token) {
      showAuthExpired('Сессия истекла — войдите снова');
      return;
    }
    // Считаем только подряд идущие неудачи без успешного hello.
    store.attempts = helloed ? 0 : store.attempts + 1;
    if (store.attempts > MAX_RECONNECT_ATTEMPTS) {
      probeSession();
      return;
    }
    $('connState').textContent = 'переподключение…';
    $('connState').style.color = 'var(--danger)';
    clearTimeout(store.reconnect);
    store.reconnect = setTimeout(connect, 1500);
  };
}

function handle(data) {
  switch (data.t) {
    case 'hello': {
      store.me = data.me;
      store.channels = data.channels || [];
      store.attempts = 0;
      $('meAva').style.background = colorOf(data.me.name);
      $('meAva').textContent = initials(data.me.name);
      $('meAva').title = data.me.name;
      renderChannels();
      send({ t: 'join', room: store.room });
      if (store.voiceRoom) send({ t: 'voice_join', room: store.voiceRoom });
      break;
    }
    case 'channels': {
      store.channels = data.channels || [];
      renderChannels();
      break;
    }
    case 'history': {
      if (!store.room && store.roomKind === 'dm') store.room = data.room;
      store.messages[data.room] = data.messages || [];
      if (data.room === store.room) renderMessages(true);
      break;
    }
    case 'msg': {
      const list = store.messages[data.room] || (store.messages[data.room] = []);
      list.push(data);
      if (data.room === store.room) {
        const mine = !!store.me && data.author === store.me.name;
        renderMessages(mine);
        if (mine) clearTyping();
      }
      break;
    }
    case 'typing': {
      if (!data.author || data.author === (store.me && store.me.name)) break;
      if (store.room && data.room && data.room !== store.room) break;
      markTyping(data.author);
      break;
    }
    case 'pong': {
      break;
    }
    case 'presence': {
      store.online = data.online || [];
      renderFriends();
      break;
    }
    case 'friends': {
      store.friends = data;
      renderFriends();
      break;
    }
    case 'dm_list': {
      store.dms = data.items || [];
      renderChannels();
      break;
    }
    case 'voice_state': {
      handleVoiceState(data);
      break;
    }
    case 'rtc': {
      handleRtc(data);
      break;
    }
    case 'error': {
      toast(data.text || 'Ошибка');
      break;
    }
    case 'notice': {
      toast(data.text || '');
      break;
    }
  }
}

/* ------------------------------------------------------------------ каналы и друзья */
function renderChannels() {
  const box = $('channels');
  box.innerHTML = '';
  for (const channel of store.channels) {
    const btn = document.createElement('button');
    btn.className = 'chan' + (store.roomKind === 'channel' && store.room === channel ? ' active' : '');
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = '# ' + channel;
    btn.appendChild(nm);

    const inThis = store.voiceRoom === channel;
    const mic = document.createElement('span');
    mic.className = 'mic';
    mic.textContent = inThis ? '🔊' : '🎧';
    mic.title = inThis ? 'Вы в голосовом канале' : 'Войти в голосовой канал';
    mic.onclick = (e) => {
      e.stopPropagation();
      inThis ? leaveVoice() : joinVoice(channel);
    };
    btn.appendChild(mic);
    btn.onclick = () => openRoom(channel, 'channel', '# ' + channel);
    box.appendChild(btn);
  }

  const dms = $('dmList');
  dms.innerHTML = '';
  for (const item of store.dms) {
    const btn = document.createElement('button');
    btn.className = 'chan' + (store.roomKind === 'dm' && store.room === item.room ? ' active' : '');
    const dot = document.createElement('span');
    dot.className = 'vdot';
    dot.style.background = (store.online || []).some((n) => n.toLowerCase() === item.name.toLowerCase())
      ? 'var(--ok)' : 'var(--muted)';
    btn.appendChild(dot);
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = item.name;
    btn.appendChild(nm);
    btn.onclick = () => openRoom(item.room, 'dm', '@ ' + item.name);
    dms.appendChild(btn);
  }
  if (!store.dms.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Пока пусто — добавьте друга по имени';
    dms.appendChild(empty);
  }
  renderVoiceBox();
}

function openRoom(room, kind, title) {
  store.room = room;
  store.roomKind = kind;
  store.roomTitle = title;
  store.typingSentAt = 0;
  clearTyping();
  $('topTitle').textContent = title;
  $('friendsPane').classList.add('hidden');
  $('messages').classList.remove('hidden');
  $('composer').classList.remove('hidden');
  $('navFriends').classList.remove('active');
  $('navChannels').classList.add('active');
  $('side').classList.remove('open');
  renderChannels();
  renderMessages(true);
  if (kind === 'dm') {
    const other = title.replace(/^@ /, '');
    send({ t: 'dm_open', name: other });
  } else {
    send({ t: 'join', room });
  }
}

function renderMessages(forceScroll) {
  const box = $('messages');
  const list = store.messages[store.room] || [];
  // Пересборка списка сбрасывает scrollTop, поэтому решаем заранее:
  // держимся низа только если пользователь и так был внизу (или явно просили).
  const stick = forceScroll || nearBottom(box);
  const prevTop = box.scrollTop;
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="empty">Сообщений пока нет — напишите первым.</div>';
    box.scrollTop = prevTop;
    return;
  }
  for (const m of list) {
    const row = document.createElement('div');
    row.className = 'msg';
    row.appendChild(avatar(m.author));
    const col = document.createElement('div');
    const head = document.createElement('div');
    head.className = 'head';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = m.author;
    who.style.color = colorOf(m.author);
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = timeOf(m.ts);
    head.append(who, when);
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = m.text;
    col.append(head, body);
    row.appendChild(col);
    box.appendChild(row);
  }
  if (stick) box.scrollTop = box.scrollHeight;
  else box.scrollTop = prevTop;
}
function nearBottom(box) {
  const el = box || $('messages');
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}

/* ------------------------------------------------------------------ «печатает…» */
function markTyping(author) {
  store.typers.set(author, Date.now());
  renderTyping();
  clearTimeout(store.typingTimer);
  store.typingTimer = setTimeout(renderTyping, TYPING_HIDE_MS + 50);
}
function clearTyping() {
  store.typers.clear();
  renderTyping();
}
function renderTyping() {
  const now = Date.now();
  for (const [author, ts] of [...store.typers]) {
    if (now - ts > TYPING_HIDE_MS) store.typers.delete(author);
  }
  const el = $('typing');
  if (!el) return;
  const names = [...store.typers.keys()];
  if (!names.length || !$('friendsPane').classList.contains('hidden')) {
    el.textContent = '';
    return;
  }
  el.textContent = names.length === 1
    ? `${names[0]} печатает…`
    : `${names.join(', ')} печатают…`;
}

function renderFriends() {
  const presence = store.online || [];
  const isOnline = (entry) => {
    if (!entry) return false;
    // Список presence свежее, чем friends-снапшот; если он пуст — верим серверу.
    if (presence.length) {
      const name = String(entry.name || '').toLowerCase();
      return presence.some((n) => String(n).toLowerCase() === name);
    }
    return !!entry.online;
  };
  const displayName = (entry) => String(entry.displayName || entry.name || '');

  const list = $('friendList');
  const req = $('requests');
  list.innerHTML = '';
  req.innerHTML = '';

  const incoming = store.friends.incoming || [];
  const outgoing = store.friends.outgoing || [];
  const friends = store.friends.friends || [];

  if (incoming.length) {
    const label = document.createElement('div');
    label.className = 'side-label';
    label.textContent = 'Заявки в друзья';
    req.appendChild(label);
  }
  for (const entry of incoming) {
    const name = String(entry.name || '');
    if (!name) continue;
    const row = document.createElement('div');
    row.className = 'frow';
    row.appendChild(avatar(name));
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = displayName(entry);
    row.appendChild(nm);
    const ok = document.createElement('button');
    ok.textContent = 'Принять';
    ok.onclick = () => send({ t: 'friend_accept', name });
    const no = document.createElement('button');
    no.textContent = 'Отклонить';
    no.onclick = () => send({ t: 'friend_remove', name });
    row.append(ok, no);
    req.appendChild(row);
  }

  const label = document.createElement('div');
  label.className = 'side-label';
  label.textContent = 'Друзья — ' + friends.length;
  list.appendChild(label);

  for (const entry of friends) {
    const name = String(entry.name || '');
    if (!name) continue;
    const row = document.createElement('div');
    row.className = 'frow';
    row.appendChild(avatar(name));
    const col = document.createElement('div');
    col.className = 'nm';
    const nm = document.createElement('div');
    nm.textContent = displayName(entry);
    const st = document.createElement('div');
    const online = isOnline(entry);
    st.className = 'st' + (online ? ' on' : '');
    st.textContent = online ? 'в сети' : 'не в сети';
    col.append(nm, st);
    row.appendChild(col);
    const write = document.createElement('button');
    write.textContent = 'Написать';
    write.onclick = () => openRoom(null, 'dm', '@ ' + name);
    const del = document.createElement('button');
    del.textContent = '✕';
    del.title = 'Убрать из друзей';
    del.onclick = () => send({ t: 'friend_remove', name });
    row.append(write, del);
    list.appendChild(row);
  }
  if (!friends.length && !incoming.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Друзей пока нет. Введите имя друга выше — он получит заявку.';
    list.appendChild(empty);
  }
  if (outgoing.length) {
    const wait = document.createElement('div');
    wait.className = 'empty';
    wait.textContent = 'Ждём ответа: ' + outgoing.map((entry) => displayName(entry)).filter(Boolean).join(', ');
    list.appendChild(wait);
  }
}

$('friendAdd').onclick = () => {
  const name = $('friendName').value.trim();
  if (!name) return;
  send({ t: 'friend_add', name });
  $('friendName').value = '';
};
$('friendName').onkeydown = (e) => { if (e.key === 'Enter') $('friendAdd').click(); };

$('navFriends').onclick = () => {
  $('friendsPane').classList.remove('hidden');
  $('messages').classList.add('hidden');
  $('composer').classList.add('hidden');
  $('topTitle').textContent = 'Друзья';
  $('navFriends').classList.add('active');
  $('navChannels').classList.remove('active');
  $('side').classList.remove('open');
  clearTyping();
  renderFriends();
};
$('navChannels').onclick = () => {
  openRoom(store.room || 'obshiy', store.roomKind, store.roomTitle);
  $('side').classList.add('open');
  setTimeout(() => $('side').classList.remove('open'), 1800);
};
$('navInvite').onclick = async () => {
  const link = location.origin;
  try {
    await navigator.clipboard.writeText(link);
    toast('Ссылка скопирована: ' + link);
  } catch {
    prompt('Скопируйте ссылку и отправьте другу:', link);
  }
};
$('newChannel').onclick = () => {
  const name = prompt('Название канала латиницей (например: obshiy, games, work)');
  if (!name) return;
  send({ t: 'create', room: name });
};
$('composer').onsubmit = (e) => {
  e.preventDefault();
  const input = $('text');
  const text = input.value.trim();
  if (!text || !store.room) return;
  send({ t: 'msg', room: store.room, text });
  input.value = '';
  store.typingSentAt = 0;
  clearTyping();
};
/* «печатает…»: не чаще одного ping-а в 2.5 с, чтобы не забивать сокет. */
$('text').addEventListener('input', () => {
  if (!$('text').value.trim() || !store.room) return;
  const now = Date.now();
  if (now - store.typingSentAt < TYPING_THROTTLE_MS) return;
  store.typingSentAt = now;
  send({ t: 'typing', room: store.room });
});
/* ------------------------------------------------------------------ голосовой чат */
async function ensureMic() {
  if (store.localStream) return store.localStream;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('браузер не даёт доступ к микрофону — нужен адрес https://');
  }
  store.localStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  return store.localStream;
}

async function joinVoice(room) {
  if (!window.RTCPeerConnection) { toast('Браузер не поддерживает голосовой чат'); return; }
  try {
    await ensureMic();
  } catch (error) {
    toast('Микрофон недоступен: ' + error.message);
    return;
  }
  if (store.voiceRoom && store.voiceRoom !== room) leaveVoice(true);
  for (const name of [...store.peers.keys()]) closePeer(name);
  store.muted = false;
  store.voiceRoom = room;
  store.voiceUsers = [{ name: store.me.name, muted: false }];
  renderVoiceBox();
  send({ t: 'voice_join', room });
  toast('Вы в голосовом канале ' + room);
}

function leaveVoice(silent) {
  if (!store.voiceRoom) return;
  send({ t: 'voice_leave' });
  for (const name of [...store.peers.keys()]) closePeer(name);
  store.voiceRoom = null;
  store.voiceUsers = [];
  if (store.localStream) {
    store.localStream.getTracks().forEach((track) => track.stop());
    store.localStream = null;
  }
  renderVoiceBox();
  renderChannels();
  if (!silent) toast('Вы вышли из голосового канала');
}

function renderVoiceBox() {
  const box = $('voiceBox');
  if (!store.voiceRoom) {
    box.classList.add('hidden');
    return;
  }
  box.classList.remove('hidden');
  $('voiceHead').textContent = 'Голос: ' + store.voiceRoom;
  const list = $('voiceUsers');
  list.innerHTML = '';
  for (const user of store.voiceUsers) {
    const row = document.createElement('div');
    row.className = 'vuser';
    const dot = document.createElement('span');
    dot.className = 'vdot';
    dot.style.background = user.muted ? 'var(--danger)' : 'var(--ok)';
    row.appendChild(dot);
    const name = document.createElement('span');
    name.textContent = user.name + (store.me && user.name === store.me.name ? ' (вы)' : '') + (user.muted ? ' 🔇' : '');
    row.appendChild(name);
    list.appendChild(row);
  }
  const mic = $('micBtn');
  mic.classList.toggle('on', store.muted);
  mic.textContent = store.muted ? '🔇 Включить' : '🎤 Микрофон';
}

function handleVoiceState(data) {
  const users = data.users || [];
  const inRoom = store.me && users.some((u) => u.name === store.me.name);
  if (inRoom) {
    store.voiceRoom = data.room;
    store.voiceUsers = users;
    syncPeers(users);
    renderVoiceBox();
  } else if (store.voiceRoom === data.room) {
    store.voiceUsers = users;
    syncPeers(users);
    renderVoiceBox();
  }
}

function syncPeers(users) {
  const others = users.map((u) => u.name).filter((n) => n !== store.me.name);
  const present = new Set(others);
  for (const name of [...store.peers.keys()]) {
    if (!present.has(name)) closePeer(name);
  }
  for (const name of others) {
    if (store.peers.has(name)) continue;
    const peer = createPeer(name);
    if (store.me.name < name) negotiate(peer);
  }
}

function createPeer(name) {
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ],
  });
  const peer = { pc, name, pending: [], audio: null };
  store.peers.set(name, peer);

  if (store.localStream) {
    store.localStream.getTracks().forEach((track) => pc.addTrack(track, store.localStream));
  }
  pc.onicecandidate = (event) => {
    if (!event.candidate) return;
    const candidate = event.candidate.toJSON ? event.candidate.toJSON() : event.candidate;
    send({ t: 'rtc', to: name, kind: 'ice', payload: candidate });
  };
  pc.ontrack = (event) => {
    if (peer.audio) return;
    const audio = document.createElement('audio');
    audio.autoplay = true;
    audio.srcObject = event.streams[0];
    document.body.appendChild(audio);
    audio.play().catch(() => {});
    peer.audio = audio;
  };
  return peer;
}

function closePeer(name) {
  const peer = store.peers.get(name);
  if (!peer) return;
  try { peer.pc.close(); } catch {}
  if (peer.audio) {
    peer.audio.pause();
    peer.audio.srcObject = null;
    peer.audio.remove();
  }
  store.peers.delete(name);
}

async function negotiate(peer) {
  try {
    const offer = await peer.pc.createOffer();
    await peer.pc.setLocalDescription(offer);
    send({ t: 'rtc', to: peer.name, kind: 'offer', payload: { type: 'offer', sdp: offer.sdp } });
  } catch (error) {
    console.warn('offer', error);
  }
}

async function flushCandidates(peer) {
  while (peer.pending.length) {
    const candidate = peer.pending.shift();
    try { await peer.pc.addIceCandidate(candidate); } catch {}
  }
}

async function handleRtc(data) {
  const name = data.from;
  if (!name) return;
  try {
    if (data.kind === 'offer') {
      let peer = store.peers.get(name);
      if (!peer) peer = createPeer(name);
      await peer.pc.setRemoteDescription(new RTCSessionDescription(data.payload));
      const answer = await peer.pc.createAnswer();
      await peer.pc.setLocalDescription(answer);
      send({ t: 'rtc', to: name, kind: 'answer', payload: { type: 'answer', sdp: answer.sdp } });
      await flushCandidates(peer);
    } else if (data.kind === 'answer') {
      const peer = store.peers.get(name);
      if (!peer) return;
      await peer.pc.setRemoteDescription(new RTCSessionDescription(data.payload));
      await flushCandidates(peer);
    } else if (data.kind === 'ice') {
      const peer = store.peers.get(name);
      if (!peer) return;
      if (peer.pc.remoteDescription) await peer.pc.addIceCandidate(data.payload);
      else peer.pending.push(data.payload);
    }
  } catch (error) {
    console.warn('rtc', error);
  }
}

$('micBtn').onclick = () => {
  const track = store.localStream && store.localStream.getAudioTracks()[0];
  store.muted = !store.muted;
  if (track) track.enabled = !store.muted;
  send({ t: 'voice_mute', muted: store.muted });
  renderVoiceBox();
};
$('leaveVoice').onclick = () => leaveVoice();

window.addEventListener('beforeunload', () => {
  if (store.voiceRoom) send({ t: 'voice_leave' });
});

/* ------------------------------------------------------------------ старт */
if (store.token) {
  start();
} else {
  setAuthMode('login');
}
</script>
